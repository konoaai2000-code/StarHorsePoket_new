function simulateSections(field,distance){
 const sections=Math.max(4,Math.round(distance/200)),length=distance/sections;
 for(const v of field){
   const early=({'逃げ':1,'先行':.52,'差し':-.38,'追込':-.83})[v.style]||0;
   v.strideNoise??=Array.from({length:sections},()=>rand(-.20,.20));
   const base=15.85+clamp(v.score,0,155)*.024;
   v.splits=[0];let time=0;
   for(let i=0;i<sections;i++){
     const t=(i+.5)/sections;
     const pace=early*(1-2*t)*1.20+(runPattern(v,(i+1)/sections)-runPattern(v,i/sections))*.09;
     const speed=base+pace+v.strideNoise[i]-(i===0?1.65:0);
     time+=length/speed;v.splits.push(Math.round(time*1000)/1000)
   }
 }
 return field.sort((a,b)=>a.splits.at(-1)-b.splits.at(-1)||a.number-b.number)
}
function timedPosition(splits,time){
 const last=splits.length-1;
 if(time>=splits[last])return 1;
 let end=1;while(end<last&&splits[end]<time)end++;
 return (end-1+clamp((time-splits[end-1])/(splits[end]-splits[end-1]),0,1))/last
}

function pedigreeChart(generations){
 const sides=[new Set(),new Set()];
 for(let depth=1;depth<=5;depth++){
   const half=2**(depth-1);
   for(let n=0;n<2*half;n++){const name=generations[depth]?.[n];if(name)sides[n<half?0:1].add(name)}
 }
 let body='';
 for(let row=0;row<32;row++){
   let cells='';
   for(let depth=1;depth<=5;depth++){
     const span=2**(5-depth);if(row%span)continue;
     const index=row/span,name=generations[depth]?.[index],both=name&&sides[0].has(name)&&sides[1].has(name);
     cells+=`<td rowspan="${span}" class="${index%2?'maternal':'paternal'}${both?' repeated':''}">${depth===1?(index?'母　':'父　'):''}${esc(name||'未登録')}${both?' ◆':''}</td>`
   }
   body+='<tr>'+cells+'</tr>'
 }
 return `<p>◆ は父方と母方に共通する祖先です。</p><div class="pedigree-scroll" tabindex="0" aria-label="5代血統表"><table><thead><tr>${[1,2,3,4,5].map(d=>'<th>'+d+'代前</th>').join('')}</tr></thead><tbody>${body}</tbody></table></div>`
}

 facilityView('pairtree','配合予定馬の5代血統表',pedigreeChart(tree))
}

 return {name:['メイクデビュー','条件戦・第2戦','条件戦・最終戦'][n],grade:'条件戦',apt:h.apt,

function conditionRound(h,watch=false){
 if(!h||h.location!=='stable'||h.debutDone||locked||h.conditionResults.length>=3)return;
 const race=conditionRace(h),film=simulateRace(race,[h],state.clock);
 const own=film.finish.find(v=>v.id===h.id),place=film.finish.indexOf(own)+1;
 const popularity=1+film.finish.filter(v=>v.estimate>own.estimate).length;
 const note=place===1?(popularity===1?'支持に応えて先頭でゴールしました。':'前評判を上回る勝利です。'):
   place<popularity?'人気以上の着順です。次の成長が楽しみです。':place<=3?'上位に食い込みました。相手が強くなったときの走りにも注目です。':'今回は前を捕まえ切れませんでした。次は距離と脚質にも注目しましょう。';
 film.debut=h.id;film.earned=[h.name+'　'+place+'着 ／ '+popularity+'番人気',note];
 h.conditionResults.push({name:race.name,place,popularity,rating:own.odds,note,film});
 if(place===1)h.conditionWins++;
 if(h.conditionResults.length===3){h.debutDone=true;h.debutReport=true;h.bornYear=state.yearStart+Math.floor(state.clock/52)}
 log(h.name+'：'+race.name+' '+place+'着'+(h.debutDone?'・入厩決定':''));
 if(watch){state.replays=[film];closeMenu();save();playNextRace()}
 else{render();openMenu('condition')}
}

function partnerEffects(card,level){

 let primary=card.distance>=2300?'stamina':card.distance<=1600?'speed':card.apt==='ダート'?'power':'temper';
 if(/逃げ|先陣|ロケット|完逃/.test(style))primary='start';
 else if(/まくり|猛襲|直線|轟脚|末脚|一閃/.test(style))primary='burst';
 else if(/先行|王道|闘争/.test(style))primary='power';
 const secondary=primary==='stamina'?'power':card.distance>=2000?'stamina':'speed';
 return {[primary]:3+level,...(secondary!==primary?{[secondary]:1+Math.floor(level/2)}:{})}

}

function registerRace(id,at){let h=current(),r=races.find(v=>v.id===id);if(!ready(h)||!r||h.entry)return;at??=nextDate(r);if(!Number.isInteger(at)||at<state.clock||!slotsByRace[id]?.includes(at%52)||eligible(h,r,at))return;let fee=entryFee(r.grade,r);if(!chargeListedFee(fee))return;h.entry={id,at,fee};log(`${h.name}：${r.name}（${dateLabel(at)}）に登録`);render();}
function cancelEntry(){let h=current();if(!h?.entry||locked)return;state.medals+=h.entry.fee||0;h.entry=null;log(`${h.name}：出走登録を取消`);render()}
function pasture(){let h=current();if(!h||h.trip||h.week<=0||locked||h.location!=='stable'||h.entry||h.trainUsed||h.feedUsed)return;h.location='pasture';h.pastureWeeks=0;log(`${h.name}：放牧へ`);render()}
function returnStable(){let h=current();if(!h||h.location!=='pasture'||h.pastureWeeks===0||locked)return;h.location='stable';delete h.pastureWeeks;log(`${h.name}：入厩`);render()}
function applyCenter(h){let k=h.centerJob.kind;if(trainers[k]){specialCourse(h,k);h.training++}else if(k==='long'){for(const p in h.stats)h.stats[p]=clamp(h.stats[p]+.7*growthFactor(h),0,Math.min(h.cap,100));h.quality=clamp(h.quality+.35,0,h.cap);h.fatigue=clamp(h.fatigue-3);h.condition=clamp(h.condition+2);h.training++;}else if(k==='rest'){h.fatigue=clamp(h.fatigue-30);h.condition=clamp(h.condition+12);}else if(k==='weight'){h.weight=clamp(h.weight+10,h.ideal-35,Math.max(h.weight,h.ideal+35));h.quality=clamp(h.quality+.6,0,h.cap)}else{h.stats[k]=clamp(h.stats[k]+3,0,Math.min(h.cap,100));h.training++;}h.centerJob.left--;if(h.centerJob.left<=0){h.centerJob=null;h.location='stable';log(`${h.name}：トレセン完了`);}}
let skipWatchRaces=null,skipAllWatch=false;
let weekInProgress=false;
function nextWeek(){
  if(locked||weekInProgress)return;
  sfx('week');
  const now=state.clock;if(now%4===0)storeCheckpoint();
  const growing=state.horses.filter(h=>h.week>0);
  const scheduled=new Map(),notes=new Map();
  for(const h of state.horses)notes.set(h.id,[]);
  for(const h of state.horses){
    const events=notes.get(h.id),last=h.rotationNews;
    dueRotation(h,now);if(last!==h.rotationNews)events.push(h.rotationNews);
    if(h.week<=0){events.push(h.trip?'遠征中':'引退待ち');continue}
    if(h.location==='pasture'){events.push('放牧・休養');
      h.fatigue=clamp(h.fatigue-10);h.condition=clamp(h.condition+2);
      if(h.pastureWeeks!=null)h.pastureWeeks++;
      continue;
    }
    if(!h.debutDone){events.push('条件戦待ち');continue}
    if(h.location==='center'){events.push('トレセン育成');applyCenter(h);advance(h);continue;}
    if(h.entry&&h.entry.at<=now){
      const race=races.find(r=>r.id===h.entry.id);
      const paidFee=h.entry.fee||0;const reason=race?eligible(h,race,now,true):'開催情報なし';
      h.entry=null;
      if(!reason){
        if(!scheduled.has(race.id))scheduled.set(race.id,[]);
        scheduled.get(race.id).push(h);
        continue;
      }
      events.push('出走取消・'+reason);state.medals+=paidFee;log(`${h.name}：出走取消（${reason}） · 登録料${paidFee}枚返還`);
    }
    const trained=h.trainUsed,fed=h.feedUsed,course=runAutoTraining(h),meal=applyAutoFeed(h);
    if(trained||course)events.push(trained?'手動調教済':'自動調教・'+course);
    else if([-2,0,1,2,6,8].includes(h.autoCourse))events.push('調教見送り・メダル不足');
    if(fed||meal)events.push(fed?'手動給餌済':'自動給餌・'+meal);
    else if([-2,0,1,2,4,...(stableLevel()>=5?[5,6]:[])].includes(h.autoFeed))events.push('給餌見送り・メダル不足');
    if(!events.length)events.push('休養');
    if(!h.trainUsed)h.fatigue=clamp(h.fatigue-6);
    advance(h);
  }
  state.replays=Array.from(scheduled,([id,horses])=>{
    const race=races.find(r=>r.id===id);
    const replay=simulateRace(race,horses,now);
    applyRace(replay,horses,race);for(const h of horses)notes.get(h.id).push(race.name+' '+h.results.at(-1).place+'着');
    replay.raceId=id;
    state.films=[replay,...(state.films||[])].slice(0,24);
    return replay;
  });
  for(const h of growing){h.weight+=2;notes.get(h.id).push('週成長 +2kg')}
  state.clock++;returnTrips();
  state.weekReport={at:now,rows:state.horses.map(h=>({name:h.name,events:notes.get(h.id).map(e=>e==='遠征中'&&!h.trip?'遠征から帰還':e),weight:h.weight,week:h.week}))};
  log(`${dateLabel()} に進みました`);
  finishWeek();
  if(state.replays.length){closeMenu();playNextRace()}
}
function playNextRace(){
  if(skipAllWatch)state.replays=[];
  if(skipWatchRaces){while(state.replays?.length&&skipWatchRaces.has(state.replays[0].raceId))state.replays.shift();if(!state.replays?.length)skipWatchRaces=null}
  if(!state.replays?.length){weekInProgress=false;render();afterWeekReports();return;}
  weekInProgress=true;
  showRace(state.replays[0]);
}

function fastForward(){

 }

function eligible(h,r,at=nextDate(r),paid=false){
 const rule=r.rule||'',age=3+state.yearStart+Math.floor(at/52)-h.bornYear;
 if(rule.includes('古馬')&&age<4)return '古馬限定';
 if(rule.includes('3歳')&&age!==3)return '3歳限定';
 if(rule.includes('牝馬')&&h.sex!=='牝')return '牝馬限定';
 if(rule.includes('G1勝利')&&!h.results.some(v=>['GI','国際GI'].includes(v.grade)&&v.place===1))return 'GI優勝が必要';
 if(rule.includes('重賞勝利')&&!h.results.some(v=>['GI','国際GI','GII','GIII','重賞'].includes(v.grade)&&v.place===1))return '重賞優勝が必要';
 if(!paid&&state.medals<entryFee(r.grade,r))return '登録料不足';
if(!h.debutDone)return '条件戦を突破してください';if(h.location!=='stable')return '入厩が必要';if(h.week<=0)return '引退時期';if(!paid&&h.fatigue>75)return '疲労が高い';if(at-state.clock>=h.week)return '開催前に現役期間終了';if(r.event&&state.clock>at)return '開催終了';if(r.id==='debut')return '条件戦で実施';if(['classic1','classic2','classic3','oaks'].includes(r.id)&&state.yearStart+Math.floor(at/52)>h.bornYear)return '3歳限定';if(r.id==='oaks'&&h.sex!=='牝')return '牝馬限定';if(r.grade==='決勝'&&!invitationBalance(h).swbc)return 'WBC優勝が必要';if(r.grade==='招待'&&!invitationBalance(h).wbc)return 'GI優勝が必要';if(r.event&&!h.results.some(v=>v.place===1))return '現役戦1勝が必要';if(r.world&&!h.results.some(v=>v.place===1&&['GI','国際GI'].includes(v.grade)))return 'GI優勝が必要';if(wins(h)<r.req)return `${r.req}勝以上必要`;return ''}
function growthFactor(h){const age=h.spent;return h.growth==='早熟'?Math.max(.52,1.24-age*.015):h.growth==='晩成'?Math.min(1.45,.72+age*.015):1.05;}
async function center(k){let h=current(),n=k==='long'?25:1;if(!ready(h)||h.entry||h.trainUsed||h.feedUsed||h.week<n)return;if(!centreAllowed(h,k))return;

 if(price){if(state.progress.gems<price||!await askOwner('馬封石'+price+'個で委託しますか？'))return;state.progress.gems-=price}else if(!await spend(n===25?5000:1000,'トレセン'))return;

function trainingWeight(i,strength){if(i===3)return 0;if(i===4)return -2;if(i===5)return 3;return -[0,4,6][[0,1,2,6,8].includes(i)?strength:1]}
function train(i,strength=1){let h=current();if(!ready(h)||h.trainUsed)return;if([3,4].includes(i)&&stableLevel()<2)return;const intensity=[0,1,2,6,8].includes(i)?clamp(strength,0,2):1;if(!chargeListedFee(4))return;applyWorkout(h,i,intensity,false);render()}

function settings(){return `<div class="panel"><h2>厩舎設定・データ管理</h2><div class="setup35"><section><h3>厩舎・観戦設定</h3>${openingSeasonControl()}<button onclick="assetPanel()">画像素材の差し替え</button><label>厩舎名<input maxlength="16" value="${esc(state.stableName||'クロニクル厩舎')}" onchange="state.stableName=this.value.trim().slice(0,16)||'クロニクル厩舎';save()"></label>${optControls()}<p><button type="button" onclick="toggleFullscreen()">全画面表示</button></p><p class="notice">iPhoneのSafariではボタン操作で全画面にできません。Safariの共有ボタンから「ホーム画面に追加」を選び、追加したアイコンから起動すると全画面（スタンドアロン表示）で遊べます。</p><p><label><input type="checkbox" ${state.returnHome?'checked':''} onchange="state.returnHome=this.checked;save()"> 週送り後にホームへ戻る</label></p><p><label><input type="checkbox" ${state.eventPreview!==false?'checked':''} onchange="state.eventPreview=this.checked;save()"> 季節杯のホーム通知</label></p></section><section><h3>保存・引き継ぎ</h3><button onclick="titleScreen()">厩舎スロットを選ぶ</button><p class="notice">ブラウザ内で自動保存します。端末やブラウザを変更する前にバックアップを作成してください。</p><p>4週ごとに、週送り前の厩舎を復元ポイントに保存します。</p><button onclick="storeCheckpoint(true)">今の状態で復元ポイントを更新</button><button onclick="loadCheckpoint()">復元ポイントを読み込む</button><div class="row"><button onclick="exportSave()">バックアップを書き出す</button><button onclick="document.getElementById('import').click()">バックアップを読み込む</button><input id="import" type="file" accept=".json,application/json" hidden onchange="importSave(this)"><button onclick="textBackup()">テキストで引き継ぎ</button><button class="danger" onclick="resetSave()">初期化</button></div></section></div></div>`}function exportSave(){let u=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download='thoroughbred-save.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),500)}function importSave(el){const file=el.files[0];if(!file)return;el.value='';file.text().then(readBackup).catch(()=>gameNotice('ファイルを読み取れませんでした。'))}async function resetSave(){if(await askOwner('全データを初期化しますか？')){state=initial();lastDraw=null;normalize();state.selected=state.horses[0].id;storeCheckpoint();render()}}

function ownerDesk(){

    ${[['株券図鑑','collection'],['株券ガチャ','gacha'],['農園','farm'],['神社','shrine'],['プレゼント','gifts'],['クエスト','quest'],['牧場事務所','office'],['馬券','predict'],['セリ市','auction'],['日替わり支給','daily'],['資料図鑑','archive'],['試走','simulation'],['季節杯','event'],['牧場日誌','news']].map(([n,k])=>`<button onclick="homeInfo('${k}')">${n}</button>`).join('')}

function validSave(s){
  if(s?.series&&(!Array.isArray(s.series.ids)||s.series.ids.length>3||!Number.isInteger(s.series.stage)||s.series.stage<0||s.series.stage>(s.series.route==='tour'?4:2)))return false;
  if(!s||!Array.isArray(s.horses)||!Array.isArray(s.retired)||!Array.isArray(s.log))return false;
  const horses=[...s.horses,...s.retired];
  const ids=new Set();
  for(const h of horses){
    if(!h||typeof h.id!=='string'||!/^[a-zA-Z0-9_-]+$/.test(h.id)||ids.has(h.id))return false;
    ids.add(h.id);
    if(typeof h.name!=='string'||!['牡','牝'].includes(h.sex)||!colors.includes(h.color))return false;
    if(h.trip&&(!Number.isSafeInteger(h.trip.due)||!Number.isSafeInteger(h.trip.prize)||h.trip.prize<0||typeof h.trip.route!=='string'))return false;
    if(h.parentIds!=null&&(!Array.isArray(h.parentIds)||h.parentIds.length>2||!h.parentIds.every(id=>typeof id==='string')))return false;
    if(!Array.isArray(h.ancestry)||!h.ancestry.every(Array.isArray)||!Array.isArray(h.parents))return false;
    if(h.conditionResults!=null&&!Array.isArray(h.conditionResults))return false;
    if(!Array.isArray(h.results)||!h.results.every(r=>r&&Number.isFinite(r.place)&&
      Number.isFinite(r.distance)&&typeof r.grade==='string'&&!/[<>]/.test(r.grade)))return false;
    if(!Object.keys(statNames).every(k=>Number.isFinite(h.stats?.[k])))return false;
    if(!['week','spent','quality','cap','weight','ideal','fatigue','condition','distance','training'].every(k=>Number.isFinite(h[k])))return false;
    if(![h.apt,h.line,h.style,h.growth].every(v=>typeof v==='string'&&!/[<>"&]/.test(v)))return false;
    if(h.entry&&(!Number.isSafeInteger(h.entry.at)||typeof h.entry.id!=='string'))return false;
    if(h.centerJob&&(!['rest','weight','start','power','burst','long','temper','short','longer','ground','adapt','elite'].includes(h.centerJob.kind)||!Number.isSafeInteger(h.centerJob.left)))return false;
  }
  if(s.progress!=null){
    if(!s.progress||typeof s.progress!=='object')return false;
    const {inventory,awake,claimed}=s.progress;
    if(!inventory||!['feed','charm'].every(k=>Number.isSafeInteger(inventory[k])&&inventory[k]>=0))return false;
    if(s.progress.cards){
      if(!Number.isSafeInteger(s.progress.tickets)||s.progress.tickets<0||
        !Object.entries(s.progress.cards).every(([id,n])=>studs.some(h=>h.id===id)&&Number.isSafeInteger(n)&&n>=1))return false;
    }else if(inventory.tokens!=null&&(!Number.isSafeInteger(inventory.tokens)||inventory.tokens<0))return false;
    if(!awake||!Object.values(awake).every(n=>Number.isInteger(n)&&n>=0&&n<=4))return false;
    if(!claimed||!Object.values(claimed).every(v=>v===true))return false;
    if(s.progress.planted!=null&&!Number.isSafeInteger(s.progress.planted))return false;
  }
  if(s.films!=null&&(!Array.isArray(s.films)||s.films.length>24))return false;
  const conditions=horses.flatMap(h=>Array.isArray(h.conditionResults)?h.conditionResults:[]);
  if(conditions.some(r=>!r||!Number.isInteger(r.place)||r.place<1||r.place>8))return false;
  const others=[...conditions,...(Array.isArray(s.cupBracket)?s.cupBracket:[])];
  const movies=[...(s.films||[]),...(Array.isArray(s.replays)?s.replays:[]),...others.filter(r=>r?.film).map(r=>r.film)];
  if((s.replays!=null&&!Array.isArray(s.replays))||(!movies.every(r=>r&&
    typeof r.name==='string'&&typeof r.grade==='string'&&Number.isFinite(r.distance)&&(!r.earned||(Array.isArray(r.earned)&&r.earned.every(v=>typeof v==='string')))&&
    Array.isArray(r.finish)&&r.finish.length>0&&r.finish.every(v=>v&&typeof v.name==='string'&&
      (!v.splits||(Array.isArray(v.splits)&&v.splits.length>=2&&v.splits.length<=128&&v.splits[0]===0&&v.splits.every((n,i)=>Number.isFinite(n)&&(!i||n>v.splits[i-1]))))&&Number.isFinite(v.score)&&typeof v.style==='string'&&/^#[0-9a-f]{6}$/i.test(v.color)))))return false;
  return true;
}

function drawCard(count=1){

 sfx('gacha');
 const batch=[],candidates=poolCards(),weights=poolWeights(candidates);
 for(let i=0;i<count;i++){
  let roll=seeded()*100;
  const tier=weights.findIndex(weight=>(roll-=weight)<0);
  const h=pick(candidates.filter(card=>cardRank(card)===(tier<0?weights.findLastIndex(w=>w>0):tier)));
  const previous=state.progress.cards[h.id]||0;
  state.progress.cards[h.id]=previous+1;batch.push({id:h.id,fresh:previous===0});log(h.name+'の株券を獲得')

}

function simulateRace(race,horses,at){
  const runnerColors=['#e8e9e7','#95b1d9','#e3a0a1','#8ec89c','#c09ad9','#d5ad80','#a5b8b6','#a2cdd2'];
  const field=horses.map((h,i)=>{
    const st=h.stats;
    const long=race.distance>=2200;
    const special=h.specialStyle&&h.partner?2:0;const timing=h.regularRider===h.tactics?.rider?h.tactics?.timing:'普通';
    const timingBonus=timing==='早め'?(st.stamina-st.burst)*.06:timing==='遅め'?(st.burst-st.stamina)*.06:0;
    const wet=(at+race.distance/100)%5===0,travel=race.world||race.grade==='国際GI';
    const readiness=(wet?((h.mud||45)-55)*.09:0)+(travel?((h.travel||45)-55)*.12+(h.foreignBonus||0):0);
    const last=h.results.at(-1),interval=last?at-last.at:8;
    const score=readiness+(last?.place===1&&interval<=7?2:0)-(interval<=1?4:interval===2?2:0)+timingBonus+fitTrait(h,race)+special+st.speed*(long?.30:.41)+st.stamina*(long?.27:.16)+st.power*.13+
      st.burst*.18+st.start*.10+st.temper*.06+(h.dualSurface||h.apt===race.apt?5:race.apt==='未記載'?0:-12)-
      (race.grade==='決勝'?0:distanceGap(h,race.distance)/180)+(h.condition-65)*.14-h.fatigue*.15-
      Math.max(0,Math.abs(h.weight-h.ideal)-6)*.2+(h.quality-60)*.43+rand(-8,8);
    return {look:horseLook(h).slice(),tack:h.tack||0,raceForm:{weight:h.weight,offset:h.weight-h.ideal,fit:!distanceGap(h,race.distance),gap:distanceGap(h,race.distance),interval:last?at-last.at:null},estimate:morningEstimate(h),id:h.id,name:h.name,color:['#edc77a','#684c8a','#af493e','#4166be'][h.silk||0]||runnerColors[i],reading:h.reading||h.name,specialStyle:h.specialStyle||'',style:h.tactics?.style||h.style,score:score+(riders[h.tactics?.rider]?.[1]===h.tactics?.style&&h.tactics?2:0)+(h.tactics&&riderSurface(h.tactics.rider)===race.apt?1:0),own:true};
  });
  const solo=horses.length===1&&horses[0].tactics?.solo&&['招待','決勝'].includes(race.grade);const opponents=rivalField(race,at,horses).map(({name,alumnus,ability:estimate,kind},i)=>{
   return {look:horseLook(alumnus||{name}),name,kind,estimate,color:runnerColors[i%runnerColors.length],style:alumnus?.style||pick(styles),score:estimate+rand(-9,10),own:false}
  });

    finish:simulateSections(racePace([...field,...opponents.map(v=>solo?{...v,score:v.score-6}:v)]),race.distance),earned:[]};
}
function applyRace(replay,horses,race){
  for(const h of horses){
    const place=replay.finish.findIndex(v=>v.id===h.id)+1;
    if(h.tactics?.solo&&['招待','決勝'].includes(race.grade)&&horses.length===1){h.soloUses??={};h.soloUses[race.grade]=(h.soloUses[race.grade]||0)+1}
    const prize=award(race.grade,place,race);
    if(race.event){const points=Math.round((9-place)*seasonalFactor(h,race));state.seriesPoints=(state.seriesPoints||0)+points;replay.earned.push(h.name+'：季節杯 '+points+'pt')}
    h.earnings=(h.earnings||0)+prize;state.medals+=prize;
    if(prize)replay.earned.push(h.name+'：賞金 '+prize+'枚');
    const mine=replay.finish[place-1],popularity=mine&&Number.isFinite(Number(mine.odds))?1+replay.finish.filter(v=>Number(v.odds)<Number(mine.odds)).length:null;
    h.results.push({odds:replay.finish[place-1].odds||null,prize,id:race.id,name:race.name,grade:race.grade,distance:race.distance,place,at:replay.at,apt:race.apt,course:race.course||'',rider:riders[h.tactics?.rider]?.[0]||(Number.isInteger(h.regularRider)?riders[h.regularRider]?.[0]:'')||'',popularity,weight:h.weight,margin:place>1&&replay.finish[place-2]?.splits&&mine?.splits?Number((mine.splits.at(-1)-replay.finish[place-2].splits.at(-1)).toFixed(2)):null});
    const effort={'決勝':2.1,'招待':1.4,GI:.7}[race.grade]||.15;
    h.quality=clamp(h.quality-effort-(replay.at-(h.results.at(-2)?.at??-100)<=1?1:0)+(place===1?.35:0),0,h.cap);
    h.fatigue=clamp(h.fatigue+24-(Number(h.health||65)-65)*.1);
    h.condition=clamp(h.condition-10);
    h.weight=clamp(h.weight-5,h.ideal-35,Math.max(h.weight,h.ideal+35));
    advance(h);
    for(const title of titles){
      if(h.titles.includes(title.name)||!title.ids.every(id=>wonTitleLeg(h,id)))continue;
      h.titles.push(title.name);
      const bonus=title.bonus||500;h.week+=title.extra;h.earnings+=bonus;state.medals+=bonus;
      replay.earned.push(`${h.name}：${title.name}（ボーナス賞金${bonus.toLocaleString()}枚・+${title.extra}週）`);
    }
    if(place===1){h.bonusWeek=replay.at+1;h.bonusGrade=race.grade;state.progress.tickets++;replay.earned.push(`${h.name}：株券ガチャチケット +1`)}
    log(`${h.name}：${race.name} ${place}着`);
  }
}

function betProbs(field){const total=field.reduce((n,v)=>n+Math.exp(v.ability/12),0);return field.map(v=>Math.exp(v.ability/12)/total)}
function harville(p,order){let rest=1,out=1;for(const i of order){out*=p[i]/rest;rest-=p[i]}return out}
function probAllInTopK(p,picks,K){
 const others=p.map((_,i)=>i).filter(i=>!picks.includes(i));
 let prob=0;const seq=[];
 const rec=()=>{
  if(seq.length===K){if(picks.every(v=>seq.includes(v)))prob+=harville(p,seq);return}
  const remaining=K-seq.length,need=picks.filter(v=>!seq.includes(v)).length;
  if(need>remaining)return;
  const cand=need===remaining?picks.filter(v=>!seq.includes(v)):[...picks.filter(v=>!seq.includes(v)),...others.filter(v=>!seq.includes(v))];
  for(const c of cand){seq.push(c);rec();seq.pop()}
 };
 rec();return prob;
}
function comboOdds(kind,p,picks){
 const cap=o=>Math.min(999.9,Math.max(1,Math.round(o*10)/10));
 if(kind==='単勝')return cap(1/p[picks[0]]);
 if(kind==='複勝')return cap(1/p[picks[0]]/3);
 const perms=a=>a.length<2?[a]:a.flatMap((v,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(r=>[v,...r]));
 if(kind==='馬単')return cap(.85/harville(p,picks));
 if(kind==='3連単')return cap(.8/harville(p,picks));
 if(kind==='3連複')return cap(.8/perms(picks).reduce((n,o)=>n+harville(p,o),0));
 if(kind==='馬連')return cap(.85/perms(picks).reduce((n,o)=>n+harville(p,o),0));
 if(kind==='ワイド'){let prob=0;for(let a=0;a<p.length;a++)for(let b=0;b<p.length;b++){if(b===a)continue;for(let c=0;c<p.length;c++){if(c===a||c===b)continue;const o=[a,b,c];if(picks.every(v=>o.includes(v)))prob+=harville(p,o)}}return cap(.85/Math.max(prob,1e-6))}
 if(kind==='サイド')return cap(.85/Math.max(probAllInTopK(p,picks,4),1e-6));
 if(kind==='トライ')return cap(.8/Math.max(probAllInTopK(p,picks,5),1e-6));
 if(kind==='メイクライド')return cap(1.2/p[picks[0]]);
 if(kind==='複権ライド')return cap(.4/p[picks[0]]);
 if(kind==='枠連'){const frames=p.map((_,i)=>Math.floor(i/2));let prob=0;for(let a=0;a<p.length;a++)for(let b=0;b<p.length;b++){if(b===a)continue;if([frames[a],frames[b]].sort((x,y)=>x-y).join('-')===picks.join('-'))prob+=harville(p,[a,b])}return cap(.85/Math.max(prob,1e-6))}
 return 1;
}

function betHit(kind,order,picks){
 const top=n=>order.slice(0,n);
 if(kind==='単勝')return top(1)[0]===picks[0];
 if(kind==='複勝')return top(3).includes(picks[0]);
 if(kind==='馬単')return top(2).join('-')===picks.join('-');
 if(kind==='馬連')return picks.every(v=>top(2).includes(v));
 if(kind==='ワイド')return picks.every(v=>top(3).includes(v));
 if(kind==='3連単')return top(3).join('-')===picks.join('-');
 if(kind==='3連複')return picks.every(v=>top(3).includes(v));
 if(kind==='枠連')return top(2).map(v=>Math.floor(v/2)).sort((a,b)=>a-b).join('-')===picks.join('-');
 if(kind==='サイド')return picks.every(v=>top(4).includes(v));
 if(kind==='トライ')return picks.every(v=>top(5).includes(v));
 if(kind==='メイクライド')return top(1)[0]===picks[0];
 if(kind==='複権ライド')return top(3).includes(picks[0]);
 return false;
}

  if(film){const field=betField(race,bet.at);order=film.finish.map(v=>field.findIndex(f=>f.name===v.name)).filter(i=>i>=0)}
  if(!order||order.length<3)order=betResult(race,bet.at);
  let payout=0,hits=0;
  for(const line of bet.lines)if(betHit(bet.kind,order,line.picks)){hits++;payout+=Math.floor(line.odds*bet.unit)}
  let jp=null;
   if(hits&&payout>=1000){jp=payout>=100000?{stage:'ULTIMATE JACKPOT',amount:666660}:payout>=10000?{stage:'EXCELLENT JACKPOT',amount:66600}:{stage:'SUPER JACKPOT',amount:2000};state.medals+=jp.amount;log(`ジャックポット！ ${jp.stage} ${jp.amount.toLocaleString()}枚`);(state.jackpots??=[]).push(jp)}

  p.betHistory??=[];p.betHistory.unshift({at:bet.at,name:bet.name,kind:bet.kind,stake:bet.stake,payout,hits,jp,lines:bet.lines.length});
  p.betHistory=p.betHistory.slice(0,20);

  if(p.betResults)delete p.betResults[bet.id+'@'+bet.at];
 }
 p.bets=pending;save();
}

  const shade=[rgb>>16,(rgb>>8)&255,rgb&255].map(c=>Math.min(255,Math.round(c*lit+4)));
  faces.push([indices,'rgb('+shade.join(',')+')'])
 }

function premiumCupTournament(){
 const hall=hallHorses();if(!hall.length||state.cupWeek===state.clock||locked)return;
 const rounds=['予選1回戦','予選2回戦','準々決勝','準決勝','決勝'],cut=[3,3,3,3,12];
 const make=(name,ability,own,style,id)=>({name,own,ability,style,id});
 let ours=hall.map(h=>make(h.name,h.quality,true,h.style,h.id)),log2=[],film=null;
 const used=new Set(hall.map(h=>h.name));
 for(let r=0;r<rounds.length&&ours.length;r++){
  const field=[...ours];for(let i=field.length;i<12;i++){let nm=rivalNames[(i+r*5)%rivalNames.length];if(used.has(nm))nm=nm+' '+(r+1);field.push(make(nm,58+r*4+i*1.6,false,styles[i%4]))}
  const finish=racePace(field.map((x,lane)=>({name:x.name,own:x.own,id:x.id,style:x.style||styles[lane%4],color:x.own?'#d8ab53':['#b48256','#a25e51','#946851','#677e8e','#576b97'][lane%5],estimate:x.ability,score:x.ability+rand(-16,16)})));
  const total=finish.reduce((n,v)=>n+Math.exp(v.estimate/12),0);for(const v of finish)v.odds=Math.max(1.01,total/Math.exp(v.estimate/12)).toFixed(1);
  const adv=finish.slice(0,cut[r]).filter(v=>v.own).map(v=>v.name);
  log2.push({round:rounds[r],field:12,ours:ours.map(x=>x.name),through:adv,winner:finish[0].name});
  if(r===rounds.length-1)film={name:'プレミアカップ決勝',grade:'殿堂',course:'極東競馬場',distance:2000,apt:'芝',at:state.clock,finish,earned:finish.filter(v=>v.own).map(v=>v.name+'：プレミアカップ決勝 '+(finish.indexOf(v)+1)+'着')};
  ours=ours.filter(x=>adv.includes(x.name));
 }
 state.cupWeek=state.clock;state.cupLog=log2;
 const best=film?film.finish.findIndex(v=>v.own)+1:0;
 state.cupBracket=film?[{round:12,a:film.finish.filter(v=>v.own).map(v=>v.name).join('・'),b:'決勝12頭',w:film.finish[0].name,film}]:[];
 state.cupReport=film?'決勝進出 · 最高 '+best+'着 · 優勝 '+film.finish[0].name:'予選敗退（'+log2.at(-1).round+'）';
 state.seriesPoints=(state.seriesPoints||0)+(best===1?8:best&&best<=3?3:1);save();
 if(film){state.replays=[film];closeMenu();playNextRace()}else{render();hallHub('cup')}
}

function legendCatalogueView(page=0){

}
let shortenPick={};
function shortenValue(target,id){const m=studs.find(v=>v.id===id);return m?1+cardRank(m)+(m.line===target.line?2:0)+(id===target.id?3:0):0}
function shortenScreen(id){
 const p=state.progress,target=studs.find(v=>v.id===id);if(!target)return;
 const mats=studs.filter(v=>(p.cards[v.id]||0)>=2);const wait=Math.max(0,(p.legendReady[id]||0)-state.clock);
 const picked=Object.entries(shortenPick).filter(([,n])=>n>0),total=picked.reduce((t,[k,n])=>t+shortenValue(target,k)*n,0),count=picked.reduce((t,[,n])=>t+n,0);
 facilityView('shorten','待機時間の短縮',`<p>${esc(target.name)}　残り待機 <b>${wait}週</b> → <b>${Math.max(0,wait-total)}週</b></p><p>選択個数 ${count}/100　合計短縮 ${total}週</p><div class="mat-grid">${mats.map(v=>`<button class="mat-cell ${(shortenPick[v.id]||0)?'on':''}" onclick="shortenPick['${v.id}']=Math.min((shortenPick['${v.id}']||0)+1,(state.progress.cards['${v.id}']||1)-1);shortenScreen('${id}')">${cardBadge(v)}<b>${esc(v.name)}</b><small>${shortenValue(target,v.id)}週 / 枚</small><em>${shortenPick[v.id]||0}/${(p.cards[v.id]||1)-1}</em></button>`).join('')||'<p>重複している株券がありません。</p>'}</div><div class="row"><button onclick="shortenPick={};shortenScreen('${id}')">クリア</button><button class="gold" ${count?'':'disabled'} onclick="applyShorten('${id}')">使用する</button></div>`,'戻る');
}
function applyShorten(id){
 const p=state.progress,target=studs.find(v=>v.id===id);if(!target)return;let total=0;
 for(const [k,n] of Object.entries(shortenPick)){const use=Math.min(n,(p.cards[k]||0)-1);if(use>0){p.cards[k]-=use;total+=shortenValue(target,k)*use}}
 p.legendReady[id]=Math.max(state.clock,(p.legendReady[id]||0)-total);shortenPick={};save();legendCatalogue();
}

const SEED_BAGS={normal:['普通のタネ袋',20,3,1],passion:['情熱のタネ袋',100,4,2],luxury:['豪華なタネ袋',300,6,3]};

function luckyOwner(){const o=state.progress?.omikuji;return Boolean(o&&o.at===state.clock&&o.fortune==='大吉')}
// 極秘調教：週ごとにセーブ内シードで抽選し、結果だけを保存する（予測不能・再読込で変わらない）
function secretAvailable(h){
 if(!h)return false;
 if(h.secretRoll?.at!==state.clock){h.secretRoll={at:state.clock,hit:seeded()<.2};try{save()}catch{}}
 return Boolean(h.secretRoll.hit);
}
function recommendedCourse(h){
 if(h.fatigue>40&&(stableLevel()>=5||luckyOwner()))return 'spa';
 const keys={0:'speed',1:'stamina',2:'burst',3:'stamina',4:'start',6:'stamina',8:'burst'};
 const weakest=Object.entries(keys).sort((a,b)=>h.stats[a[1]]-h.stats[b[1]])[0];
 return Number(weakest?.[0]??0);
}
function partnerFee(card,tier){
 const m=String(card?.source?.[6]||'').match(new RegExp('(?:P調教|パートナー調教)'+tier+'(?:コスト)?\\s*(\\d+)枚'));
 return m?Number(m[1]):[15,30,60][tier-1]||15;
}
function centreReason(h,a){
 if(!ready(h))return '入厩中のみ';if(h.entry)return '出走登録中';if(h.trainUsed||h.feedUsed)return '今週は調教・飼葉済み';
 if(ownerRank()<2)return 'セレブランク シルバー2で開放';
 if(trainers[a]&&ownerRank()<trainers[a][1])return 'シルバー'+trainers[a][1]+'で開放';
 if(trainers[a]&&trainers[a][1]>=10&&(h.eliteCount||0)>=3)return '特訓は3回まで';
 if(h.week<(a==='long'?25:1))return '残り週が不足';
 return '';
}
function cropName(id){return FARM_CROPS[id]?.name||({feed:'特別配合飼料'})[id]||id}
function farmScreen(){

  if(!v)return `<article class="farm-plot empty"><b>畑 ${i+1}</b><p>空き畑</p><div class="seed-buttons">${Object.entries(SEED_BAGS).map(([id,[n,cost,weeks]])=>`<button onclick="plantSeed(${i},'${id}')">${n}<small>${cost}枚 · ${weeks}週</small></button>`).join('')}</div></article>`;

 };

 (p.plots||[]).forEach((v,i)=>{if(v){const left=Math.max(0,v.due-state.clock);legacy.push(`<article class="farm-plot legacy"><b>旧区画${i+2}</b><p>${left?'あと'+left+'週':'収穫可'}</p><button onclick="managePlot(${i})" ${left?'disabled':''}>収穫する</button></article>`)}});
 const inv=p.inventory;
 const grid=Object.entries(FARM_CROPS).map(([id,c])=>`<div class="crop-cell ${inv[id]?'':'none'}"><span>${c.icon}</span><small>${c.name}</small><b>${Math.min(99,inv[id]||0)}/99</b></div>`).join('');
 const juice=Object.entries(JUICES).map(([id,need])=>`<button onclick="makeJuice('${id}')" ${need.every(k=>inv[k]>0)?'':'disabled'}>${FARM_CROPS[id].icon} ${FARM_CROPS[id].name}を作る<small>${need.map(cropName).join('＋')}</small></button>`).join('');
 const foods=['feed',...Object.keys(FARM_CROPS)].filter(k=>inv[k]>0);

 return `<div class="farm-screen"><div class="farm-fields"><p class="muted">肥料 ${inv.fertilizer||0}個　タネ袋は種類ごとに収穫物が変わります（豪華ほど珍しい作物）。</p><div class="farm-plots">${p.farm.map(plot).join('')}${legacy.join('')}</div></div><section class="farm-feed"><h3>農園飼葉</h3><div class="crop-grid">${grid}</div><div class="juice-row">${juice}</div></section>${pet}</div>`;

async function plantSeed(i,bag){
 const p=state.progress;p.farm??=[null,null,null];const b=SEED_BAGS[bag];if(!b||p.farm[i]||!await spend(b[1],b[0]))return;
 p.farm[i]={bag,due:state.clock+b[2]};save();refreshFeature('farm');
}
function harvestPlot(i){
 const p=state.progress,v=p.farm?.[i];if(!v||v.due>state.clock)return;
 const tier=SEED_BAGS[v.bag]?.[3]||1,pool=Object.entries(FARM_CROPS).filter(([,c])=>c.tier&&c.tier<=tier&&c.tier>=Math.max(1,tier-1)).map(([id])=>id);
 const got={};for(let n=0;n<3+(tier===3?1:0);n++){const id=pool[Math.floor(seeded()*pool.length)];got[id]=(got[id]||0)+1;p.inventory[id]=Math.min(99,(p.inventory[id]||0)+1)}
 p.farm[i]=null;log('農園で '+Object.entries(got).map(([k,n])=>cropName(k)+'×'+n).join('・')+' を収穫しました');save();refreshFeature('farm');
}
function makeJuice(id){
 const need=JUICES[id],inv=state.progress.inventory;if(!need||!need.every(k=>inv[k]>0))return;
 for(const k of need)inv[k]--;inv[id]=Math.min(99,(inv[id]||0)+1);log(FARM_CROPS[id].name+'を作りました');save();refreshFeature('farm');

/* ===== 第12弾：実録音の効果音・秘書ボイス・実況（assets/audio/）。読み込めない環境では従来の合成音・端末音声に戻る ===== */
const AUDIO_BASE='assets/audio/',audioBroken=new Set(),audioCache={};
// 声の音声ファイル（assets/audio/voice/）を使うか。false の間は従来どおり端末の読み上げで話す
const VOICE_FILES=false;
function audioBase(path){let a=audioCache[path];if(!a){a=new Audio(window.AUDIO_PACK?.[path]||AUDIO_BASE+path);a.preload='auto';audioCache[path]=a}return a}
// 再生できたら Audio を返す。ファイル欠落時は fallback を呼ぶ（初回の失敗は error イベントで検知）
function playFile(path,volume,fallback,loop=false){
 if(audioBroken.has(path)||!(volume>0))return null;
 let fellBack=false;const once=()=>{if(fellBack)return;fellBack=true;audioBroken.add(path);if(fallback)fallback()};
 try{
  const a=loop?audioBase(path):audioBase(path).cloneNode();
  a.loop=loop;a.volume=Math.max(0,Math.min(1,volume));
  a.addEventListener('error',once,{once:true});
  const p=a.play();if(p)p.catch(e=>{if(e&&e.name==='NotSupportedError')once()});
  return a;
 }catch{return null}
}
const SFX_FILES={start:'fanfare',win:'fanfareBig',gacha:'gacha',card:'card',great:'great',success:'success',week:'week',coin:'coin',error:'error',click:'click',cheer:'cheer',applause:'applause'};
function sfx(name){
 if(!state.effects)return;
 const file=SFX_FILES[name];
 if(!file){sfxSynth(name);return}
 if(!playFile('sfx/'+file+'.mp3',Number(state.effects)/100,()=>sfxSynth(name)))sfxSynth(name);
}

 try{voicePlaying?.pause()}catch{}
 try{if('speechSynthesis' in window)speechSynthesis.cancel()}catch{}
 voicePlaying=playFile(path,Number(state.voiceVolume??75)/100,fallback);
 return voicePlaying;
}

 const sets={greet:secGreet,cheer:secCheer,praise:secPraise,calm:secCalm,birth:secBirth,raceWin:secRaceWin,racePlace:secRacePlace,raceBoard:secRaceBoard,raceOut:secRaceOut,raceOther:secRaceOther};
 for(const [k,arr] of Object.entries(sets))if(arr[i]===text)return `voice/s${i}/${k}.mp3`;
 return null;
}
// 実況：区間が変わるたびに短いクリップ。重要な掛け声（最後の直線・ゴール）は前の声を切って割り込む
let callAudio=null,callUntil=0;
function raceCallBusy(){return Math.max(0,callUntil-performance.now())}
function sayCall(key,priority,then){
 if(!state.voice)return false;
 const now=performance.now();
 if(!priority&&callAudio&&!callAudio.paused&&!callAudio.ended)return true;
 try{callAudio?.pause()}catch{}
 const a=playFile('voice/commentary/'+key+'.mp3',Number(state.voiceVolume??75)/100,null);
 if(!a)return false;
 callAudio=a;callUntil=now+2600;
 a.addEventListener('loadedmetadata',()=>{if(callAudio===a&&isFinite(a.duration))callUntil=performance.now()+a.duration*1000+150},{once:true});
 if(then)a.addEventListener('ended',then,{once:true});
 return true;
}
function raceCall(phase,positions,lanes,leader,t,finish,speed){
 raceAmbience(phase);
 if(!state.voice)return;
 const numberOf=v=>{const i=lanes.indexOf(v);return Math.min(18,Math.max(1,Number(v?.number)||i+1))};
 const leadV=lanes.find(v=>v.name===leader);
 const fallback=()=>{const runner=leadV;try{sayLocal(phase+'、'+(runner?.reading||leader)+(t===1?'が優勝です':'が先頭です'))}catch{}};
 if(!VOICE_FILES||audioBroken.has('voice/commentary/start.mp3')){fallback();return}
 const lead='lead'+numberOf(leadV);
 let ok=true;
 if(phase==='発走')ok=sayCall('start',true);
 else if(phase==='コーナー')ok=speed>1?true:sayCall('corner',false);
 else if(phase==='直線区間')ok=sayCall(lead,false);
 else if(phase==='最終コーナー')ok=sayCall('finalCorner',false,()=>{if(lastRacePhase==='最終コーナー')sayCall(lead,false)});
 else if(phase==='最後の直線')ok=sayCall('homeStretch',true);
 else if(phase==='直線競走')ok=sayCall('sprint',true);
 else if(phase==='確定')ok=sayCall('goal',true,()=>sayCall('win'+numberOf(finish[0]),true));
 if(!ok)fallback();
}
// 場内の音：歓声のループと蹄音。最後の直線で盛り上げ、ゴールで大歓声
let ambCrowd=null,ambGallop=null,lastRacePhase='';
function fadeTo(a,vol,ms=600){if(!a)return;const from=a.volume,t0=performance.now();const step=()=>{const k=Math.min(1,(performance.now()-t0)/ms);try{a.volume=Math.max(0,Math.min(1,from+(vol-from)*k))}catch{}if(k<1)requestAnimationFrame(step);else if(vol===0){try{a.pause()}catch{}}};requestAnimationFrame(step)}
function raceAmbience(phase){
 lastRacePhase=phase;
 const fx=Number(state.effects||0)/100;
 if(phase==='stop'){fadeTo(ambCrowd,0,400);fadeTo(ambGallop,0,300);return}
 if(!fx)return;
 if(phase==='start'){
  try{ambCrowd?.pause();ambGallop?.pause()}catch{}
  ambCrowd=playFile('sfx/crowd.mp3',fx*.28,null,true);if(ambCrowd)try{ambCrowd.currentTime=0}catch{}
  ambGallop=playFile('sfx/gallop.mp3',fx*.55,null,true);if(ambGallop)try{ambGallop.currentTime=0}catch{}
  return;
 }
 if(phase==='最終コーナー')fadeTo(ambCrowd,fx*.45);
 if(phase==='最後の直線'||phase==='直線競走'){fadeTo(ambCrowd,fx*.7);fadeTo(ambGallop,fx*.8)}
 if(phase==='確定'){fadeTo(ambGallop,0,900);fadeTo(ambCrowd,fx*.3,1500);sfx('cheer')}
}

  raceAmbience('stop');$('raceDialog').close();
  locked=false;
  if(weekInProgress){const finished=state.replays.shift();save();playNextRace();if(finished?.debut&&!state.replays.length&&current()?.id===finished.debut)openMenu('condition')}
  else render();
};

function loadArt(src){const image=new Image();image.src=src;return image}
const runners19=loadArt('assets/img/59fd3c9cd1e7.webp'), stadium19=loadArt('assets/img/d521009ca729.webp');
function coatPhoto(h){
 const index=colors.indexOf(h.color);
 if(index===2)return 'black';
 if(index===3)return 'grey';
 if(index>=0)return 'bay';
 return ['bay','grey','black'][Array.from(String(h.id)).reduce((v,c)=>v+c.charCodeAt(0),0)%3]
}
function albumButton(h,r){
 const index=(state.films||[]).findIndex(f=>f.at===r.at&&f.raceId===r.id&&f.finish.some(v=>v.own&&v.id===h.id));
 return index<0?'':`<button class="film-button" onclick="watchFilm(${index})">▶ 再観戦</button>`
}
function watchFilm(index){
 const film=state.films?.[index];
 if(locked||weekInProgress||!film)return;
 closeMenu();showRace({...film,archive:true})
}

const artNames=['farm','shrine','hall','breeding','turf','dirt','wood','pool','gate','spa','hay','radish','carrot','cheese','tea','apple','banana','seeds','charm_growth','charm_speed','charm_stamina','charm_turf','charm_sand','ticket','orb','key','pig','goat','dog','cat','chicken',...Array.from({length:6},(_,i)=>'frame_0'+(i+1)),'stable_empty','horse_bay','horse_chestnut','horse_darkbay','horse_black','horse_grey','horse_white','track_dirt_day','track_turf_wet','track_overseas','track_night',
 ...Array.from({length:3},(_,i)=>'birth_0'+(i+1)),...Array.from({length:8},(_,i)=>'gallop_0'+(i+1))];
const assetData=JSON.parse(document.getElementById('asset-pack').textContent);
const assetImages={};
function applyArtwork(){
 for(const name of artNames){
   const url=assetData[name];if(!url||assetImages[name]?.src===url)continue;
   assetImages[name]=new Image();assetImages[name].src=url;
 }
 const style=document.getElementById('user-art-style');
 const rules=[];
 for(const coat of ['bay','chestnut','darkbay','black','grey','white']){
   const horse=assetData['horse_'+coat];if(!horse)continue;
   const bg=assetData.stable_empty;
   rules.push(`.stable-screen .horse-stage.custom-${coat},.parent-photo.custom-${coat},.roster-photo.custom-${coat}{background-image:url("${horse}")${bg?',url("'+bg+'")':''};background-size:contain,cover;background-position:center;background-color:#4a5649}.stable-photo.custom-${coat}:before,.stable-photo.custom-${coat}:after{display:none}`);
 }
 const facilities={farm:'[data-view=farm] .facility-head',shrine:'[data-view=shrine] .facility-head',hall:'body[data-screen=records] .honour-gate',breeding:'.breed-heading'};
 for(const [name,selector] of Object.entries(facilities))if(assetData[name])rules.push(selector+'{min-height:100px;background:linear-gradient(0deg,#19342ce0,transparent),url("'+assetData[name]+'") center/cover;color:white}');
 for(let tier=0;tier<6;tier++){const src=assetData['frame_0'+(tier+1)];if(src)rules.push('.compare-card.frame-'+tier+'{border:10px solid;border-image:url("'+src+'") 14% stretch}')}
 style.textContent=rules.join('\n')
}
function assetIcon(name){return assetData[name]?`<img class="asset-icon" alt="" src="${assetData[name]}">`:''}
function petIcon(name){return assetIcon(({子ブタ:'pig',白ヤギ:'goat',柴犬:'dog',ネコ:'cat',ニワトリ:'chicken'})[name]||'pig')}
function customCoat(h){
 const n=colors.indexOf(h.color);
 return ['chestnut','darkbay','black','grey','white'][n]||coatPhoto(h)
}
function birthPictures(d){
 const shots=['birth_01','birth_02','birth_03'].filter(k=>assetData[k]);if(!shots.length)return;
 const scene=d.querySelector('.birth-scene');let index=0;
 const paint=()=>{scene.style.setProperty('--foal-photo','url("'+assetData[shots[index]]+'")');scene.querySelector('small').textContent=['母馬に見守られて','はじめの一歩','仔馬誕生'][Number(shots[index].slice(-1))-1]};
 paint();if(shots.length===1||matchMedia('(prefers-reduced-motion: reduce)').matches){index=shots.length-1;paint();return}
 const timer=setInterval(()=>{if(!d.open||++index>=shots.length){clearInterval(timer);return}paint()},1300);
 d.addEventListener('close',()=>clearInterval(timer),{once:true})
}
function assetPanel(){
 facilityView('artwork','画像素材',`<p>素材リストのファイル名でPNG・WebP・JPEGを選んでください。選んだ画像はゲームに反映され、「画像入りHTMLを保存」で1つにまとめられます。</p><label>画像を追加<input id="assetFiles" type="file" multiple accept="image/png,image/webp,image/jpeg" onchange="installArtwork(this)"></label><p id="assetMessage" role="status">登録済み ${Object.keys(assetData).length}枚</p><button id="saveArtwork" onclick="exportArtwork()">画像入りHTMLを保存</button><details><summary>対応ファイル名</summary><p>${artNames.join(' ／ ')}</p></details>`)
}
async function installArtwork(input){
 const status=$('assetMessage'),saveButton=$('saveArtwork');saveButton.disabled=true;input.disabled=true;
 let added=0,skipped=0;
 try{
   for(const file of input.files){
     const name=file.name.replace(/\.[^.]+$/,'').toLowerCase();
     if(!artNames.includes(name)||!['image/png','image/jpeg','image/webp'].includes(file.type)){skipped++;continue}
     const url=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file)});
     const image=new Image();image.src=url;try{await image.decode()}catch{skipped++;continue}
     assetData[name]=url;added++;
   }
   applyArtwork();status.textContent=added+'枚を反映しました。読み込み対象外 '+skipped+'枚。';
 }catch{applyArtwork();status.textContent=added+'枚を反映しました。残りのファイルを読み取れませんでした。'}
 finally{saveButton.disabled=false;input.disabled=false;input.value=''}
}
function exportArtwork(){
 const html=baseDocument.replace(/(<script type="application\/json" id="asset-pack">)[^<]*(<\/script>)/,(_,open,end)=>open+JSON.stringify(assetData)+end);
 const url=URL.createObjectURL(new Blob([html],{type:'text/html;charset=utf-8'}));
 const link=document.createElement('a');link.href=url;link.download='horse_stable_custom.html';link.click();setTimeout(()=>URL.revokeObjectURL(url),15000)
}

applyArtwork();normalize();
render();
titleScreen();
</script><script id="fit-script">
'use strict';
/* ===== 第10弾：横画面フィットスケーリング（ステージを実効ビューポートへ一括縮小・レターボックス）＋全画面化 ===== */
const FIT_W=1180,FIT_H=664;
let fitFrameEl=null,fitStageNode=null,fitQueued=false;
function computeFitScale(availW,availH){
 if(!(availW>0)||!(availH>0))return 0;
 return Math.min(availW/FIT_W,availH/FIT_H,1);
}
function unwrapFit(){
 if(fitStageNode){
  const st=fitStageNode.style;
  st.width='';st.height='';st.transform='';
  if(fitFrameEl&&fitFrameEl.parentNode){fitFrameEl.parentNode.insertBefore(fitStageNode,fitFrameEl);fitFrameEl.remove()}
 }
 fitFrameEl=null;fitStageNode=null;
}
function fitStage(){
 try{
  const app=document.getElementById('app');if(!app)return;
  const vv=window.visualViewport;
  const vw=vv?vv.width:window.innerWidth,vh=vv?vv.height:window.innerHeight;
  const stage=app.querySelector('.catalog-home,.stable-screen,.home-screen');
  if(!stage||!(vw>vh)){unwrapFit();return}
  if(!fitFrameEl||!fitFrameEl.isConnected||fitStageNode!==stage){
   unwrapFit();
   fitFrameEl=document.createElement('div');fitFrameEl.className='fit-frame';
   stage.parentNode.insertBefore(fitFrameEl,stage);
   fitFrameEl.appendChild(stage);
   fitStageNode=stage;
  }
  fitFrameEl.style.width='';fitFrameEl.style.height='';
  const availW=fitFrameEl.clientWidth;
  const top=fitFrameEl.getBoundingClientRect().top;
  const footer=document.querySelector('body>footer');
  const footH=footer?footer.offsetHeight:0;
  const availH=vh-top-footH-4;
  const s=computeFitScale(availW,availH);
  if(!(s>0)||s>=0.999){unwrapFit();return}
  fitFrameEl.style.width=(FIT_W*s)+'px';
  fitFrameEl.style.height=(FIT_H*s)+'px';
  const st=fitStageNode.style;
  st.width=FIT_W+'px';st.height=FIT_H+'px';
  st.transform='scale('+s+')';
 }catch(e){/* 計測に失敗した場合は従来レイアウトのまま */}
}
function queueFit(){if(fitQueued)return;fitQueued=true;requestAnimationFrame(()=>{fitQueued=false;fitStage()})}
window.addEventListener('resize',queueFit);
window.addEventListener('orientationchange',()=>setTimeout(queueFit,80));
if(window.visualViewport)window.visualViewport.addEventListener('resize',queueFit);
const fitAppEl=document.getElementById('app');
if(fitAppEl)new MutationObserver(queueFit).observe(fitAppEl,{childList:true,subtree:true});
queueFit();
async function toggleFullscreen(){
 const doc=document,el=doc.documentElement;
 const fsEl=doc.fullscreenElement||doc.webkitFullscreenElement;
 if(fsEl){const exit=doc.exitFullscreen||doc.webkitExitFullscreen;if(exit)exit.call(doc);return}
 const req=el.requestFullscreen||el.webkitRequestFullscreen;
 if(req){try{await req.call(el)}catch(e){gameNotice('全画面表示を開始できませんでした。')}return}
 gameNotice('この端末・ブラウザではボタンで全画面にできません（iPhoneのSafariなど）。Safariの共有ボタンから「ホーム画面に追加」を選び、追加したアイコンから起動すると全画面で遊べます。');
}
</script></body></html>
